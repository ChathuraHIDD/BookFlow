spring.application.name=backend

server.port=8080

spring.mongodb.uri=${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:${MONGO_URI:mongodb://localhost:27017/bookflow_db}}}
spring.data.mongodb.auto-index-creation=true

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.auth.secret=${APP_AUTH_SECRET:bookflow-change-this-secret}
app.auth.token-expiry-hours=24
app.auth.google.client-id=${APP_AUTH_GOOGLE_CLIENT_ID:}
